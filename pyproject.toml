[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-service"
version = "0.1.0"
description = "Fine-tune a Hugging Face base model and publish it to the Hub"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
llm = [
    "accelerate",
    "datasets",
    "huggingface_hub",
    "peft",
    "transformers",
    "trl",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
